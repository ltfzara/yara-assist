<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>وضعیت سفارش</title>
<style>
  :root { --bg:#f6f7f9; --panel:#fff; --ink:#202735; --muted:#788292; --line:#e8ebf0; --primary:#0b6e6e; --primary2:#e0f0ee; --red:#c34d55; --redbg:#ffeaeb; }
  * { box-sizing:border-box }
  body { margin:0; background:var(--bg); color:var(--ink); font-family:Vazirmatn,Tahoma,'Segoe UI',sans-serif; line-height:1.8; }
  .wrap { max-width:460px; margin:0 auto; padding:22px 16px 40px }
  .shop { text-align:center; color:var(--muted); font-size:13px; margin-bottom:6px }
  h1 { font-size:20px; text-align:center; margin:0 0 16px }
  .card { background:var(--panel); border:1px solid var(--line); border-radius:16px; padding:18px; box-shadow:0 8px 28px rgba(27,38,59,.06) }
  .prod { font-weight:700; margin-bottom:2px }
  .sub { color:var(--muted); font-size:13px }
  .steps { list-style:none; margin:18px 0 4px; padding:0 }
  .steps li { position:relative; padding:0 34px 16px 0; color:var(--muted); font-size:14px }
  .steps li:last-child { padding-bottom:0 }
  .steps li::before { content:''; position:absolute; right:0; top:4px; width:20px; height:20px; border-radius:50%; background:#fff; border:2px solid var(--line) }
  .steps li::after { content:''; position:absolute; right:9px; top:26px; bottom:-2px; width:2px; background:var(--line) }
  .steps li:last-child::after { display:none }
  .steps li.done { color:var(--ink) }
  .steps li.done::before { background:var(--primary); border-color:var(--primary) }
  .steps li.done::after { background:var(--primary) }
  .steps li.now { color:var(--primary); font-weight:700 }
  .steps li.now::before { background:var(--primary2); border-color:var(--primary); box-shadow:0 0 0 4px var(--primary2) }
  .track { margin-top:16px; background:var(--primary2); border-radius:12px; padding:12px 14px }
  .track b { display:block; direction:ltr; text-align:right; font-size:18px; letter-spacing:.5px; word-break:break-all }
  .track button { margin-top:8px; border:0; background:var(--primary); color:#fff; border-radius:10px; padding:7px 14px; font:inherit; font-size:13px; cursor:pointer }
  .cancel { background:var(--redbg); color:var(--red); border-radius:12px; padding:12px 14px; margin-top:6px; font-weight:700 }
  .foot { text-align:center; color:var(--muted); font-size:12px; margin-top:14px }
  .err { text-align:center; padding:30px 10px; color:var(--muted) }
</style>
</head>
<body>
<div class="wrap" id="root"><div class="err">در حال بارگذاری…</div></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  // Public (publishable) credentials only; the data is exposed through one narrow RPC.
  const SUPABASE_URL = 'https://acgojmfvpnnaqzrazyvt.supabase.co';
  const SUPABASE_ANON_KEY = 'sb_publishable_UEn6HH6AEVcah6I7OFvCKA_BjpqRMsk';

  const STEPS = [
    ['new', 'سفارش ثبت شد'],
    ['paid', 'پرداخت تأیید شد'],
    ['making', 'در حال آماده‌سازی'],
    ['ready', 'آماده ارسال'],
    ['sent', 'ارسال شد'],
    ['done', 'تحویل داده شد']
  ];
  const root = document.getElementById('root');
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const faNum = n => Number(n).toLocaleString('fa-IR');
  function dateFa(v) {
    if (!v) return '';
    try { return new Date(v).toLocaleDateString('fa-IR-u-ca-persian', { year: 'numeric', month: 'long', day: 'numeric' }); } catch (e) { return ''; }
  }
  function tokenFromUrl() {
    const m = location.pathname.match(/\/s\/([A-Za-z0-9]{20,64})/);
    if (m) return m[1];
    return new URLSearchParams(location.search).get('t') || '';
  }
  function fail(msg) { root.innerHTML = '<div class="err">' + esc(msg) + '</div>'; }

  async function boot() {
    const token = tokenFromUrl();
    if (!token) return fail('لینک ناقص است. از فروشنده بخواه دوباره بفرستد.');
    if (!window.supabase) return fail('اتصال برقرار نشد؛ چند لحظه بعد دوباره امتحان کن.');
    const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, { auth: { persistSession: false } });
    const { data, error } = await sb.rpc('yara_public_order_status', { p_token: token });
    if (error) return fail('مشکلی پیش آمد؛ چند لحظه بعد دوباره امتحان کن.');
    if (!data) return fail('سفارشی با این لینک پیدا نشد. از فروشنده بخواه لینک را دوباره بفرستد.');
    render(data);
  }

  function render(d) {
    document.title = 'وضعیت سفارش' + (d.shop_name ? ' · ' + d.shop_name : '');
    const idx = STEPS.findIndex(s => s[0] === d.status);
    const cancelled = d.status === 'cancel';
    const steps = STEPS.map((s, i) => {
      const cls = cancelled ? '' : (i < idx ? 'done' : i === idx ? 'now' : '');
      return '<li class="' + cls + '">' + s[1] + '</li>';
    }).join('');
    const changed = dateFa(d.status_changed_at);
    root.innerHTML =
      '<div class="shop">' + esc(d.shop_name || 'فروشگاه') + '</div>' +
      '<h1>' + (d.first_name ? 'سلام ' + esc(d.first_name) + '، ' : '') + 'وضعیت سفارشت</h1>' +
      '<div class="card">' +
        '<div class="prod">' + esc(d.product_name || 'سفارش شما') + '</div>' +
        (d.due_date ? '<div class="sub">موعد تحویل: ' + esc(dateFa(d.due_date + 'T12:00:00')) + '</div>' : '') +
        (cancelled ? '<div class="cancel">این سفارش لغو شده است. اگر اشتباه است به فروشنده پیام بده.</div>' : '<ul class="steps">' + steps + '</ul>') +
        (d.tracking_code ? '<div class="track"><span class="sub">کد رهگیری مرسوله</span><b id="trk">' + esc(d.tracking_code) + '</b><button onclick="copyTrk()">کپی کد</button></div>' : '') +
      '</div>' +
      '<div class="foot">' + (changed ? 'آخرین به‌روزرسانی: ' + esc(changed) + ' · ' : '') + 'برای دیدن آخرین وضعیت، صفحه را دوباره باز کن</div>';
  }

  function copyTrk() {
    const t = document.getElementById('trk')?.textContent || '';
    if (navigator.clipboard) navigator.clipboard.writeText(t).catch(() => {});
    const b = document.querySelector('.track button'); if (b) { b.textContent = 'کپی شد ✓'; setTimeout(() => b.textContent = 'کپی کد', 1500); }
  }

  boot();
</script>
</body>
</html>
